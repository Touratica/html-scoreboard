name: Commitlint
on:
  pull_request:

jobs:
  commitlint:
    name: Lint commit messages # required status check; renaming it breaks the ruleset
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            echo "Linting $(git log -1 --format='%h %s' "$sha")"
            if ! git log -1 --format=%B "$sha" | pnpm exec commitlint; then
              echo "::error title=Invalid commit message::$sha does not follow Conventional Commits; see the rules reported above"
              failed=1
            fi
          done
          exit "$failed"
